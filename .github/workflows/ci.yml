name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and check CLI
        run: |
          python -m py_compile bin/panr
          python bin/panr --help
          python bin/panr --version
      - name: Run fixture smoke test
        run: |
          python bin/panr \
            --ncbi-dir tests/fixtures/ncbi \
            --abricate-dir tests/fixtures/abricate \
            --output-dir test_output \
            --format png \
            --genep 0 \
            --nseq 1
          test -s test_output/merged_output/ncbi_ncbi_summary.csv
          test -s test_output/merged_output/ncbi_ncbi_tidy_summary.csv
