name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and check CLI
        run: |
          python -m py_compile bin/panr panr2/*.py
          python bin/panr --help
          python bin/panr --version
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run fixture smoke test
        run: |
          python bin/panr \
            --ncbi-dir tests/fixtures/ncbi \
            --abricate-dir tests/fixtures/abricate \
            --output-dir test_output \
            --format png \
            --genep 0 \
            --nseq 1 \
            --min-identity 90 \
            --min-samples-per-group 2 \
            --core-threshold 75 \
            --rare-threshold 25 \
            --top-n 10 \
            --cooccurrence-min-prevalence 0 \
            --cooccurrence-top-n 10 \
            --vfdb-dir tests/fixtures/vfdb \
            --plasmidfinder-dir tests/fixtures/plasmidfinder
          test -s test_output/qc/panr2_input_qc.csv
          test -s test_output/qc/ncbi_filter_report.csv
          test -s test_output/qc/panr2_input_qc_summary.txt
          test -s test_output/merged_output/ncbi_ncbi_summary.csv
          test -s test_output/merged_output/ncbi_ncbi_tidy_summary.csv
          test -s test_output/analysis/ncbi_sample_resistome_burden.csv
          test -s test_output/analysis/ncbi_gene_prevalence_summary.csv
          test -s test_output/analysis/ncbi_resistome_category_summary.csv
          test -s test_output/analysis/ncbi_resistance_class_summary.csv
          test -s test_output/analysis/ncbi_gene_cooccurrence_matrix.csv
          test -s test_output/analysis/ncbi_top_gene_pairs.csv
          test -s test_output/analysis/ncbi_class_cooccurrence_matrix.csv
          test -s test_output/analysis/ncbi_top_class_pairs.csv
          test -s test_output/report/ncbi_panr2_report.md
          test -s test_output/report/ncbi_panr2_report.html
          test -s test_output/report/ncbi_methods.txt
          test -s test_output/virulence/virulence_feature_summary.csv
          test -s test_output/virulence/virulence_category_summary.csv
          test -s test_output/plasmid/plasmid_feature_summary.csv
          test -s test_output/plasmid/plasmid_category_summary.csv
